# Style of every vanilla enchantment in item lore.
#
#   enabled      false = the enchantment is not written to the lore
#   display      name shown (a language file can override it: enchant-names.<key>)
#   description  text for %description% (a language file can override it: enchant-descriptions.<key>)
#   format       the lore line. Placeholders: %name% %level_roman% %level_int% %description%
#   priority     lower numbers are listed first
#
# Same format as the original RPGItemStyler, so existing files can be copied over.

enchants:
  sharpness:
    enabled: true
    display: "Sharpness"
    description: ""
    format: "&8» &c%name% &7%level_roman%"
    priority: 10
