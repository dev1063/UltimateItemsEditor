# Style of every attribute modifier in item lore.
# Keys are matched by their last part, so "attack_damage" also matches the old "generic.attack_damage".
# You may also group them (generic: / player: ... ) like the original RPGItemStyler files.
#
#   enabled   false = the attribute is not written to the lore
#   display   name shown (a language file can override it: attribute-names.<key>)
#   icon      text for %icon%
#   format    the lore line. Placeholders: %icon% %value% %display%
#             values look like +5.00 (add), +10.00% (add scalar) or x1.10 (multiply)
#   priority  lower numbers are listed first
# Attributes that are not listed use a generic style.

attributes:
  attack_damage:
    enabled: true
    display: "Attack Damage"
    icon: "⚔"
    format: "&7%icon% &c%value% &7%display%"
    priority: 10
