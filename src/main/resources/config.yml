# UltimateItemsEditor - configuration
# (templates = palettes.yml, enchantment/attribute styles = enchantsstyle/*.yml, texts = messages/<language>.yml)

# Main modules. Restart the server after changing these switches.
modules:
  vanilla: true
  custom-commands: true
  # Controls the reward editor, commands and activation listener independently.
  consumables: true
  # Loads the catalog, the custom enchantment editor and enchant-bound rules.
  custom-enchantments: false

# Optional native attribute bonuses for equipped armor of the same set.
vanilla-armor-sets:
  enabled: false

# Language of the plugin messages AND of the texts written into item lore (enchantment names,
# attribute names, %lang:key% used inside templates). Any file in plugins/UltimateItemsEditor/messages/ works:
# copy english.yml to e.g. portuguese.yml, translate it and set "language: portuguese".
# Can also be changed in game with /ie language <name>.
language: english

# Template used by "/ie template apply" when no name is given.
default-template: legendary

# Force the vanilla enchantment / attribute tooltip to be hidden on every templated item,
# whatever the template says (the template lore already lists them).
hide-enchants-globally: false
hide-attributes-globally: false

# Decimals shown for attribute values (0-6).
attribute-decimal-places: 2

# true : the item's own lore (descriptions you wrote) is kept between the template header and the
#        enchantment/attribute lines.
# false: only the template is shown; the original lore is stored and comes back with "/ie template reset".
keep-item-lore: true

# Triggers: rules that react to what players do (clicks, attacks, breaking blocks, ...) and run actions.
# Rules live in plugins/UltimateItemsEditor/rules/*.yml (see examples.yml). With no rules nothing is registered.
triggers:
  # false = the trigger engine never registers a listener or a task.
  enabled: true
  # PERIODIC rules are checked every this many ticks (20 = once per second) for every online player.
  periodic-base-ticks: 20
  # A rule that throws this many errors is switched off until /ie rules reload.
  max-rule-errors: 5

# Optional ways to obtain catalog enchantments through native Minecraft interfaces.
# Requires modules.custom-enchantments and triggers.enabled. Reload with /ie rules reload.
custom-enchant-acquisition:
  table:
    enabled: false
    # Chance per successful vanilla enchant. Higher table offers allow higher custom levels.
    chance-percent: 20
    # Draw one enchantment, then one eligible level, using these weights for both draws.
    rarity-weights: {common: 60, uncommon: 30, rare: 12, epic: 4, legendary: 1}
  villagers:
    enabled: false
    # Chance to replace a newly generated librarian enchanted-book offer.
    chance-percent: 20
    rarity-weights: {common: 45, uncommon: 27, rare: 15, epic: 7, legendary: 2}
  inventory:
    enabled: true
    success-percent: 70
    destruction-percent: 30
    # enchantment consumes the book only; item consumes the book and destroys the target.
    destruction-mode: enchantment
  anvil:
    # Turn off to require the inventory application odds for all catalog books.
    enabled: true
    # Book application: this base cost + (book level - 1) + prior work penalty.
    base-level-cost: 3

# Performance limits shared by the custom enchantment catalog.
enchantment-performance:
  # Weighted units per tick for area effects, summons, volleys and terrain edits (32–256).
  work-per-tick: 64
  # Optional effects wait in a bounded queue and expire after ten ticks of backlog (16–1024).
  max-queued-effects: 256
  # Spread periodic player checks across this many ticks of each trigger interval (1–20).
  periodic-spread-ticks: 8

# Consumable items: items that run console commands when clicked and are used up (/ie consumable).
# Each one is a file in plugins/UltimateItemsEditor/consumables/. With none, no listener is registered.
consumables:
  enabled: true

# Menus
gui:
  # A soft click sound when a menu button is pressed.
  click-sounds: true

# Custom items: items with skills (triggers, conditions and actions that belong to the item) (/ie customitem).
# Each one is a file in plugins/UltimateItemsEditor/customitems/. Their skills run on the trigger engine.
customitems:
  enabled: true
